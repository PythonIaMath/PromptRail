[project]
name = "promptrail-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "certifi>=2026.7.22",
  "httpx[http2]>=0.27,<1",
  "promptrail",
  "pyfiglet==1.0.4",
  "pymongo>=4.11,<5",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "langchain>=1.3,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.uv.sources]
promptrail = { path = "..", editable = true }
